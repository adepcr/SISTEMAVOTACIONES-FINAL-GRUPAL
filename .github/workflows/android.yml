# Cada vez que se sube un cambio a main, arma la app de Android (.apk).
# Queda en "Actions" → la ejecución → "Artifacts" → ADEP-Vota-android. Es opcional (ver PUBLICAR.md).
# La página se publica en GitHub Pages con el flujo «Publicar página» (pagina.yml).
name: Armar app Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run copiar && npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v5
        with:
          name: ADEP-Vota-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
