# Construye la app de Android (.apk) cada vez que se sube un cambio.
# El archivo queda en la pestaña "Actions" de GitHub → la ejecución → "Artifacts".
name: App Android

on:
  push:
    branches: [main, app-movil]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run copiar && npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ADEP-Vota-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
